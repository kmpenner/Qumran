name: Convert TXT to XML

on:
  push:
    paths:
      - "English Translation/original/scroll/*.txt"
  workflow_dispatch:        # allow a manual full run

jobs:
  convert-txt-to-xml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # need history: the default shallow clone makes
                            # github.event.before a "bad object"

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Convert every changed scroll
        run: |
          set -euo pipefail
          BEFORE='${{ github.event.before }}'
          # On a manual run, or when `before` is unknown/empty tree, do them all.
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No usable base commit - converting all scrolls."
            find "English Translation/original/scroll" -name '*.txt' -print0 > changed.z
          else
            git diff --name-only -z "$BEFORE" '${{ github.event.after }}' \
              -- "English Translation/original/scroll/*.txt" > changed.z
          fi

          count=0
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue          # skip deletions
            python3 "English Translation/scripts/txt_to_s_xml.py" "$f"
            count=$((count+1))
          done < changed.z
          rm -f changed.z
          echo "Converted $count file(s)."
          echo "CONVERTED=$count" >> "$GITHUB_ENV"

      - name: Commit and Push XML
        if: env.CONVERTED != '0'
        run: |
          set -euo pipefail
          git config user.name  'github-actions'
          git config user.email 'actions@github.com'
          git add -- "English Translation/original/scroll/*.xml"
          if git diff --cached --quiet; then
            echo "No XML changes to commit."
            exit 0
          fi
          git commit -m "Auto-convert ${CONVERTED} scroll TXT file(s) to XML"
          git push
