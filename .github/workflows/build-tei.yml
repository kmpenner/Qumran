name: Build TEI and statistics

on:
  push:
    paths:
      - "English Translation/original/scroll/*.txt"
      - "English Translation/scripts/build_tei.py"
      - "English Translation/scripts/corpus_stats.py"
      - ".github/workflows/build-tei.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-to-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install lxml
        run: pip install --quiet lxml

      - name: Build TEI
        run: python3 "English Translation/scripts/build_tei.py"

      - name: Validate TEI is well-formed and uses only the expected elements
        run: |
          python3 - <<'PY'
          from lxml import etree
          import os, sys, collections

          TEI = "{http://www.tei-c.org/ns/1.0}"
          ALLOWED = {
              "TEI","teiHeader","fileDesc","titleStmt","title","publicationStmt",
              "sourceDesc","p","text","body","div","lb","gap","supplied",
              "unclear","del","add","corr",
          }
          src = "English Translation/tei"
          seen, bad = collections.Counter(), []
          for name in sorted(os.listdir(src)):
              if not name.endswith(".xml"):
                  continue
              try:
                  tree = etree.parse(os.path.join(src, name))
              except etree.XMLSyntaxError as exc:
                  bad.append(f"{name}: {exc}")
                  continue
              for el in tree.iter():
                  tag = el.tag.replace(TEI, "")
                  seen[tag] += 1
                  if tag not in ALLOWED:
                      bad.append(f"{name}: unexpected element <{tag}>")
          print("elements:", dict(seen))
          if bad:
              print("\n".join(bad[:40]), file=sys.stderr)
              sys.exit(1)
          print(f"Validated {sum(1 for f in os.listdir(src) if f.endswith('.xml'))} TEI files.")
          PY

      - name: Corpus statistics
        run: python3 "English Translation/scripts/corpus_stats.py"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  'github-actions'
          git config user.email 'actions@github.com'
          git add -- "English Translation/tei" "English Translation/STATS.md" \
                     "English Translation/derived"
          if git diff --cached --quiet; then
            echo "No change to TEI or statistics."
            exit 0
          fi
          git commit -m "Rebuild TEI and corpus statistics"
          git push
