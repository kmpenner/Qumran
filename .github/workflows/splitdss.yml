name: Split DSS File

on:
  push:
    paths:
      - "English Translation/original/dss.txt"
  workflow_dispatch:

concurrency:
  group: commit-to-main
  cancel-in-progress: false

jobs:
  split-dss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # The python below must stay indented inside this block scalar. It was
      # previously at column 0, which ended the scalar and made the whole
      # workflow file invalid YAML - the run never started.
      - name: Split dss.txt into scrolls
        run: |
          python3 - <<'PY'
          import os

          def split_file(input_file):
              output_dir = os.path.join(os.path.dirname(input_file), 'scroll')
              os.makedirs(output_dir, exist_ok=True)

              with open(input_file, encoding='utf-8') as f:
                  lines = f.readlines()

              current_file, content, written = None, [], 0

              def flush():
                  nonlocal current_file, content, written
                  if current_file and content:
                      with open(os.path.join(output_dir, current_file), 'w',
                                encoding='utf-8') as out:
                          out.writelines(content)
                      written += 1
                  current_file, content = None, []

              for line in lines:
                  if line.strip() == '':
                      flush()
                  elif current_file is None:
                      current_file = f'{line.strip()}.txt'
                  else:
                      content.append(line)
              flush()
              print(f'Wrote {written} scroll file(s) to {output_dir}')

          split_file('English Translation/original/dss.txt')
          PY

      - name: Commit and Push Scroll Files
        run: |
          set -euo pipefail
          git config user.name  'github-actions'
          git config user.email 'actions@github.com'
          git add -- "English Translation/original/scroll/"
          if git diff --cached --quiet; then
            echo "No changes in original/scroll/, skipping commit."
            exit 0
          fi
          git commit -m 'Auto-split dss.txt into separate scroll files'
          git push
