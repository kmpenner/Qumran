name: Lint transcriptions

on:
  push:
    paths:
      - "original/scroll/*.txt"
      - "scripts/lint_transcriptions.py"
      - ".github/workflows/lint.yml"
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Lint
        run: python3 scripts/lint_transcriptions.py
